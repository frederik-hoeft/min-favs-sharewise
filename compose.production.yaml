# Local production-style packaging, not host provisioning or automated deployment.
# Use with the ignored .local/production/compose.env created by the operator.
name: ${COMPOSE_PROJECT_NAME:-sharewise-p26ab-local}

services:
  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharewise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - source: sharewise_app_password
        target: sharewise.database.app-password
      - source: sharewise_migrator_password
        target: sharewise.database.migrator-password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    networks:
      - data
    healthcheck:
      # A TCP probe cannot succeed against the temporary socket-only init server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sharewise"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    image: ${SHAREWISE_BACKEND_IMAGE:-sharewise-backend:local}
    build:
      context: ./src/backend/sharewise
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
    secrets:
      - source: sharewise_app_password
        target: sharewise.database.app-password
      - source: sharewise_migrator_password
        target: sharewise.database.migrator-password
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/system/v1/health > /dev/null"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s

  frontend:
    image: ${SHAREWISE_FRONTEND_IMAGE:-sharewise-frontend:local}
    build:
      context: ./src/frontend
    restart: unless-stopped
    environment:
      SHAREWISE_PUBLIC_HOST: ${SHAREWISE_PUBLIC_HOST:?Set SHAREWISE_PUBLIC_HOST in the Compose environment file}
      SHAREWISE_HTTPS_PORT: ${SHAREWISE_HTTPS_PORT:-8443}
    ports:
      - "${SHAREWISE_HTTP_BIND:-127.0.0.1}:${SHAREWISE_HTTP_PORT:-8080}:80"
      - "${SHAREWISE_HTTPS_BIND:-127.0.0.1}:${SHAREWISE_HTTPS_PORT:-8443}:443"
    volumes:
      - ${SHAREWISE_TLS_DIR:-./.local/production/tls}:/etc/nginx/tls:ro
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  postgres_admin_password:
    file: ${SHAREWISE_SECRETS_DIR:-./.local/production/secrets}/postgres_admin_password
  sharewise_app_password:
    file: ${SHAREWISE_SECRETS_DIR:-./.local/production/secrets}/sharewise.database.app-password
  sharewise_migrator_password:
    file: ${SHAREWISE_SECRETS_DIR:-./.local/production/secrets}/sharewise.database.migrator-password

networks:
  edge: {}
  data:
    internal: true

volumes:
  postgres_data: {}
