# Interim test configuration (P1.2 -> P1.3c): the database-free Spring tests, including the
# full-application context tests, run on an in-memory H2 database without Flyway.
# PostgreSQL-backed integration tests and their provisioning are introduced with P1.3c.
# Loaded from classpath:/config/, so it overrides only these keys of the main configuration.
spring.datasource.url=jdbc:h2:mem:sharewise-context-tests;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop