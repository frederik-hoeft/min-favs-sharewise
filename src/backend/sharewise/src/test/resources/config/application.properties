# Test configuration for the database-free Spring tests (`mvn test`), including the full-application
# context tests: they run on an in-memory H2 database without Flyway. The PostgreSQL integration tests
# (*IT, `mvn verify`) override these keys with a disposable PostgreSQL database.
# Loaded from classpath:/config/, so it overrides only these keys of the main configuration.
spring.datasource.url=jdbc:h2:mem:sharewise-context-tests;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
