spring.application.name=sharewise
# Database persistence contexts must end with each explicit transaction segment.
spring.jpa.open-in-view=false

# PostgreSQL. The defaults target the dev-container database and are dev-only credentials;
# other environments override them via SPRING_DATASOURCE_URL/_USERNAME/_PASSWORD.
# The runtime connection uses the least-privilege application role (no DDL).
spring.datasource.url=jdbc:postgresql://postgres:5432/sharewise
spring.datasource.username=sharewise_app
spring.datasource.password=sharewise_app_dev

# Flyway applies the migrations with the migration role (SPRING_FLYWAY_USER/_PASSWORD).
spring.flyway.user=sharewise_migrator
spring.flyway.password=sharewise_migrator_dev
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=flyway
spring.flyway.schemas=flyway

# Flyway owns the schema; Hibernate only validates its mappings against it.
spring.jpa.hibernate.ddl-auto=validate
