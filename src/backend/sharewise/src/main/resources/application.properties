spring.application.name=sharewise
sharewise.app.name=sharewise
spring.mvc.problemdetails.enabled=true
# Treat API request payloads as explicit contracts, without implicit JSON field or scalar coercion.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
sharewise.app.api-default-page-size=50
# Database persistence contexts must end with each explicit transaction segment.
spring.jpa.open-in-view=false

# PostgreSQL. The defaults target the dev-container database and are dev-only credentials;
# other environments override them via SPRING_DATASOURCE_URL/_USERNAME/_PASSWORD.
# The runtime connection uses the least-privilege application role (no DDL).
spring.datasource.url=jdbc:postgresql://postgres:5432/sharewise
spring.datasource.username=sharewise_app
spring.datasource.password=sharewise_app_dev

# Flyway applies the migrations with the migration role (SPRING_FLYWAY_USER/_PASSWORD).
spring.flyway.user=sharewise_migrator
spring.flyway.password=sharewise_migrator_dev
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=flyway
spring.flyway.schemas=flyway

# Flyway owns the schema; Hibernate only validates its mappings against it.
spring.jpa.hibernate.ddl-auto=validate

# Spring Modulith event publication registry (P2.4a). Flyway owns messaging.event_publication;
# the framework must not create or alter it. Completed publications are deleted, while failed
# and outstanding ones stay for recovery (docs/architecture/messaging.md).
spring.modulith.events.jdbc.schema=messaging
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=delete
# Listeners own no transaction (the dispatched operation commits through Transactions), so the
# publication is completed by the interceptor in a separate transaction after the listener
# returned. The in-listener mode only applies to @Transactional listeners; pinning the mode
# documents the contract. EventPublicationRegistryE2E proves a consumer commit failure keeps it.
spring.modulith.events.completion=in-interceptor

# Recovery (P2.4a, D9). ShareWise runs a single backend instance, so republishing outstanding
# publications on restart cannot race another instance; multi-instance deployments must revisit
# this. Staleness moves stuck publications to FAILED; staleness.published exceeds the worst-case
# executor queue wait so queued hand-offs are not marked stale. Publications are never abandoned
# (abandon-after-attempts=-1 and no AbandonPolicy beans): under completion-mode=delete an
# abandoned publication would be deleted.
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.staleness.check-interval=PT1M
spring.modulith.events.staleness.published=PT10M
spring.modulith.events.staleness.processing=PT10M
spring.modulith.events.staleness.resubmitted=PT10M
spring.modulith.events.resubmission.abandon-after-attempts=-1
sharewise.events.resubmission.interval=PT1M
sharewise.events.resubmission.initial-backoff=PT1M
sharewise.events.resubmission.max-backoff=PT30M
sharewise.events.resubmission.batch-size=50
sharewise.events.resubmission.max-in-flight=4

# Bounded executor for asynchronous event listeners (Boot's application task executor). A
# rejected hand-off is logged by Spring and leaves the publication PUBLISHED, so staleness
# monitoring or restart republication recovers it; shutdown waits for in-flight deliveries.
# A ThreadPoolExecutor only grows beyond its core size once the queue is full, so core = max.
spring.task.execution.thread-name-prefix=sharewise-async-
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s
