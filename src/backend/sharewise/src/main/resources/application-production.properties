# The production proxy strips untrusted client forwarding headers. Backend HTTP
# must only be reachable from the private Compose edge network.
server.forward-headers-strategy=framework

# Mandatory secret files are mounted at /run/secrets/ by Compose. Importing the
# directory alone is insufficient: explicit placeholders also reject missing
# individual secrets instead of falling back to application.properties' dev
# defaults. No administrator credential is available to the backend.
spring.config.import=configtree:/run/secrets/
spring.datasource.password=${sharewise.database.app-password}
spring.flyway.password=${sharewise.database.migrator-password}
