# Minimal static-image routing for Phase B. Phase C owns TLS, API proxying,
# forwarded-header trust and the final cache/security policy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
