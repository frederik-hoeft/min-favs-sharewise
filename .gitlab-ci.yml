# Both builds gate the shared test stage. PostgreSQL suites then depend on
# the preceding backend suite, not unrelated frontend checks. No DinD.
stages:
  - build
  - test # Also used by GitLab's SAST and secret-detection templates.
  - test-backend-integration
  - test-backend-e2e
  # No `needs` on the version job or future publish jobs: all prior gates
  # (including the security templates) must finish first.
  - image-version
  - image-publish # Phase F: backend and frontend versioned pushes
  - image-release # Phase F: validate paired digests and write release artifact
  - image-promote # Phase F: main-only latest promotion

variables:
  # Initial image version; changes require explicit release-policy review.
  MAJOR_VERSION: '0'
  MINOR_VERSION: '1'
  # Security analyzers must also run in merge-request pipelines.
  AST_ENABLE_MR_PIPELINES: 'true'
  SECRET_DETECTION_ENABLED: 'true'

# Prefer MR pipelines over duplicate push pipelines for unprotected branches.
# Keep protected-ref pipelines (including protected pushes with an open MR),
# as well as tag, scheduled, manually started and API pipelines.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Protected refs keep their push pipelines and cannot be auto-canceled.
    # This rule must precede both the MR and duplicate-push rules.
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always

# Publish stable versions from protected main; opt-in preview versions from
# protected dev-<slug> tags. Protect dev-* in GitLab repository settings.
# Ordinary branch pushes, MRs, forks, schedules, API and manual pipelines
# keep their verification jobs but do not publish images.
.image-publishable:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_PROJECT_PATH == "min-favs/sharewise" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_PROJECT_PATH == "min-favs/sharewise" && $CI_COMMIT_TAG =~ /^dev-[a-z0-9]+(-[a-z0-9]+)*$/ && $CI_COMMIT_REF_PROTECTED == "true"'

.backend-maven:
  image: eclipse-temurin:25-jdk
  interruptible: true
  cache: &backend_maven_cache
    key:
      files:
        - src/backend/sharewise/pom.xml
        - src/backend/sharewise/.mvn/wrapper/maven-wrapper.properties
      prefix: backend-maven
    paths:
      - .m2/repository/
    policy: pull
  before_script:
    - export MAVEN_OPTS="-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    - cd src/backend/sharewise
    - chmod +x mvnw

.postgres-tests:
  extends: .backend-maven
  services:
    - name: postgres:18-trixie
      alias: postgres
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres_dev
    SHAREWISE_TEST_DB_URL: jdbc:postgresql://postgres:5432/postgres
    SHAREWISE_TEST_DB_ADMIN_USER: postgres
    SHAREWISE_TEST_DB_ADMIN_PASSWORD: postgres_dev
  before_script:
    - export MAVEN_OPTS="-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    - cd src/backend/sharewise
    - chmod +x mvnw
    # The runner provides a TCP service, not a Docker API.
    - |
      for attempt in $(seq 1 60); do
        if (echo > /dev/tcp/postgres/5432) 2>/dev/null; then
          break
        fi
        if [ "$attempt" -eq 60 ]; then
          echo "PostgreSQL service unavailable after 60 readiness attempts" >&2
          exit 1
        fi
        sleep 1
      done

.backend-test-reports:
  artifacts:
    when: always
    reports:
      junit:
        - src/backend/sharewise/target/surefire-reports/TEST-*.xml
        - src/backend/sharewise/target/failsafe-reports/TEST-*.xml
    expire_in: 1 day

.frontend-npm:
  image: node:24-alpine
  interruptible: true
  dependencies: [] # Each job installs from the lockfile, not prior outputs.
  cache: &frontend_npm_cache
    key:
      files:
        - src/frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - src/frontend/.npm/
    policy: pull
  before_script:
    - cd src/frontend
    # Cache package downloads, never node_modules or compiled Next.js state.
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline

build-backend:
  extends: .backend-maven
  stage: build
  cache:
    <<: *backend_maven_cache
    policy: pull-push
  script:
    - ./mvnw -B -ntp -Punit-tests -DskipUnitTests=true clean package
  artifacts:
    paths:
      - src/backend/sharewise/target/*.jar
    expire_in: 1 hour

build-frontend:
  extends: .frontend-npm
  stage: build
  cache:
    <<: *frontend_npm_cache
    policy: pull-push
  script:
    - npm run build

test-backend-unit:
  extends: [.backend-maven, .backend-test-reports]
  stage: test
  dependencies: [] # No backend packaging artifact is needed.
  script:
    - ./mvnw -B -ntp -Punit-tests clean verify

test-backend-integration:
  extends: [.postgres-tests, .backend-test-reports]
  stage: test-backend-integration
  needs:
    - job: test-backend-unit
      artifacts: false
  script:
    - ./mvnw -B -ntp -Pintegration-tests clean verify

test-backend-e2e:
  extends: [.postgres-tests, .backend-test-reports]
  stage: test-backend-e2e
  needs:
    - job: test-backend-integration
      artifacts: false
  script:
    - ./mvnw -B -ntp -Pe2e-tests clean verify

test-frontend-lint:
  extends: .frontend-npm
  stage: test
  script:
    - npm run lint

test-frontend-typecheck:
  extends: .frontend-npm
  stage: test
  script:
    - npm run typecheck

test-frontend-test-typecheck:
  extends: .frontend-npm
  stage: test
  script:
    - npm run test:typecheck

test-frontend-vitest:
  extends: .frontend-npm
  stage: test
  script:
    - npm run test -- --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml
  artifacts:
    when: always
    reports:
      junit:
        - src/frontend/vitest-junit.xml
    expire_in: 1 day

test-frontend-static-export:
  extends: .frontend-npm
  stage: test
  script:
    - npm run test:static-export

# Validates the offline handoff without a language SDK or project dependency downloads.
test-offline-handoff:
  stage: test
  image: python:3.12-trixie
  interruptible: true
  dependencies: []
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends xz-utils
  script:
    - bash scripts/test-offline-handoff.sh

# Check version construction on every pipeline, including non-publishing MRs.
test-image-version:
  image: alpine:3.24
  stage: test
  interruptible: true
  dependencies: []
  script:
    - sh scripts/ci/test-construct-image-version.sh

# This job runs only after ALL build, test and security gates finish. The
# artifact is the single version source for the Phase F image publishing jobs.
construct-version:
  extends: .image-publishable
  image: alpine:3.24
  stage: image-version
  dependencies: []
  script:
    - sh scripts/ci/construct-image-version.sh image-version/version.txt
  artifacts:
    paths:
      - image-version/version.txt
    expire_in: 7 days

# Keep the security analyzers alongside the other checks after a successful build.
sast:
  stage: test
  # Template analyzer jobs extend sast and must not download backend build artifacts.
  dependencies: []
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: test
  dependencies: []
